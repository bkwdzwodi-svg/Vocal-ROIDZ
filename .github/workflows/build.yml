name: Build Windows VST3

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows VST3
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel --target VocalROIDZ_VST3

      - name: Package VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter '*.vst3' | Select-Object -First 1
          if (-not $vst3) { throw 'No .vst3 bundle was produced' }

          @"
          VOCAL ROIDS - Windows VST3
          ==========================

          1. Copy the 'Vocal ROIDZ.vst3' folder (keep its Contents folder inside)
             into:  C:\Program Files\Common Files\VST3
          2. Rescan plugins in your DAW.
          3. Insert 'Vocal ROIDZ' by BKWDZ on a vocal track.

          In the plugin, pick a preset from the header and use the nine-section
          rail on the left: Autotune, Pitch, EQ, Compressor, Saturation, Reverb,
          Limit, Gate and FX. The FX page holds the remaining effects, including
          the convolver, cassette and DJ spin.
          "@ | Out-File -Encoding ASCII INSTALL.txt

          Compress-Archive -Path $vst3.FullName, INSTALL.txt -DestinationPath 'VocalROIDZ-Windows-VST3.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: VocalROIDZ-Windows
          path: VocalROIDZ-Windows-VST3.zip
          if-no-files-found: error

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0
          name: VOCAL ROIDS 2.3.0 - Windows VST3
          body: |
            Windows VST3 build of VOCAL ROIDS.

            1. Unzip and copy the `Vocal ROIDZ.vst3` folder into `C:\Program Files\Common Files\VST3`.
            2. Rescan plugins in your DAW and insert **Vocal ROIDZ** by BKWDZ.

            2.3.0: autotune is now classic hard tune only - the formant and hard-tune switches are
            gone, the tuner always snaps, and retune/humanize stay for feel. The EQ is a seven-band
            display with live spectrum and axis labels, the compressor uses a cleaner peak+RMS
            detector, and the FX rack adds a real convolver, cassette and DJ spin in place of the
            generic creative effect. The whole preset bank was rebuilt, including Melodic Trap and
            Trap Tune.
          files: VocalROIDZ-Windows-VST3.zip
          fail_on_unmatched_files: true
