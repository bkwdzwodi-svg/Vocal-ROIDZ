name: Build Windows VST3

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows VST3
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel --target VocalROIDZ_VST3

      - name: Package VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter '*.vst3' | Select-Object -First 1
          if (-not $vst3) { throw 'No .vst3 bundle was produced' }
          Compress-Archive -Path $vst3.FullName -DestinationPath 'VocalROIDZ-Windows-VST3.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: VocalROIDZ-Windows
          path: VocalROIDZ-Windows-VST3.zip
          if-no-files-found: error
